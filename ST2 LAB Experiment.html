<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Student Registration Form</title>
</head>
<body style="margin:0; font-family: 'Times New Roman', Times, serif; background:#fff;">

  <div style="box-sizing:border-box; margin:16px; border:2px solid #000; padding:12px; min-height:85vh; display:flex; flex-direction:column;">

    
    <div style="border-bottom:1px solid #bbb; padding:8px 0 18px 0; text-align:center;">
      <h1 style="margin:0; font-size:30px; font-weight:700;">Student Registration Form</h1>
    </div>

    <div style="flex:1; padding:18px 12px; display:flex;">
      <form style="width:520px;">

        <div style="margin-bottom:10px; display:flex; align-items:center;">
          <label for="fullname" style="width:120px; font-size:14px;">Full Name:</label>
          <input id="fullname" name="fullname" type="text" placeholder="Enter your full name"
                 style="flex:1; padding:4px 6px; border:1px solid #999; border-radius:3px; font-size:13px;" />
        </div>

      
        <div style="margin-bottom:10px; display:flex; align-items:center;">
          <label for="email" style="width:120px; font-size:14px;">Email:</label>
          <input id="email" name="email" type="email" placeholder="Enter valid email address"
                 style="flex:1; padding:4px 6px; border:1px solid #999; border-radius:3px; font-size:13px;" />
        </div>

    
        <div style="margin-bottom:10px; display:flex; align-items:center;">
          <label for="password" style="width:120px; font-size:14px;">Password:</label>
          <input id="password" name="password" type="password" placeholder="Enter password"
                 style="flex:1; padding:4px 6px; border:1px solid #999; border-radius:3px; font-size:13px;" />
        </div>

      
        <div style="margin-bottom:10px; display:flex; align-items:center;">
          <label style="width:120px; font-size:14px;">Gender:</label>
          <div style="flex:1; font-size:13px;">
            <label style="margin-right:10px;"><input type="radio" name="gender" value="male" /> Male</label>
            <label style="margin-right:10px;"><input type="radio" name="gender" value="female" /> Female</label>
            <label><input type="radio" name="gender" value="other" /> Other</label>
          </div>
        </div>

       
        <div style="margin-bottom:10px; display:flex; align-items:center;">
          <label for="course" style="width:120px; font-size:14px;">Course:</label>
          <select id="course" name="course" style="flex:1; padding:4px 6px; border:1px solid #999; border-radius:3px; font-size:13px;">
            <option value="">-- Select Course --</option>
            <option>B.Tech CSE</option>
            <option>B.Sc</option>
            <option>MCA</option>
            <option>M.Tech</option>
          </select>
        </div>

        <div style="margin-bottom:10px; display:flex; align-items:center;">
          <label for="contact" style="width:120px; font-size:14px;">Contact No:</label>
          <input id="contact" name="contact" type="tel" placeholder="Enter phone number"
                 style="flex:1; padding:4px 6px; border:1px solid #999; border-radius:3px; font-size:13px;" />
        </div>

        <div style="margin-bottom:12px; display:flex; align-items:flex-start;">
          <label for="address" style="width:120px; font-size:14px; margin-top:6px;">Address:</label>
          <textarea id="address" name="address" rows="4" placeholder="Enter your address"
                    style="flex:1; padding:6px; border:1px solid #999; border-radius:3px; font-size:13px; resize:vertical;"></textarea>
        </div>

        <div style="margin-top:8px;">
          <input type="submit" value="Register" style="padding:6px 10px; border:1px solid #666; border-radius:4px; cursor:pointer; font-size:13px;"/>
          <input type="reset" value="Clear" style="padding:6px 10px; border:1px solid #666; border-radius:4px; margin-left:8px; cursor:pointer; font-size:13px;"/>
        </div>

      </form>

  
      <div style="flex:1;"></div>
    </div>

    <div style="border-top:1px solid #bbb; padding:10px 0; text-align:center; font-size:12px;">
      © 2025 Student Registration Portal
    </div>

  </div>
</body>
</html>
